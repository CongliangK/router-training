name: Public CPU tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Keep the project's CUDA-capable pins; these tests do not use a GPU or weights.
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run public and available archive checks
        run: python -m unittest discover -s tests -v
